[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tigergraph-agentic-fraud-investigation"
version = "0.1.0"
description = "TigerGraph-first agentic fraud investigation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "polars>=1.14.0",
    "duckdb>=1.1.3",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
